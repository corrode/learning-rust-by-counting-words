[package]
name = "perf-par-wc"
version = "0.1.0"
edition = "2024"
description = "A simple word count utility"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/corrode/learning-rust-by-counting-words"
keywords = ["wc", "word-count", "cli"]
categories = ["command-line-utilities"]

[dependencies]
rayon = "1.12.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[lib]
name = "wc"

[[bin]]
name = "wc"
path = "src/main.rs"

[[bench]]
name = "wordcount"
harness = false
